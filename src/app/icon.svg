<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vayu-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Emerald-Mint Atmospheric Flow Gradient -->
    <linearGradient id="vayu-emerald" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Air Flow Accent -->
    <linearGradient id="vayu-cyan" x1="40" y1="8" x2="8" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="vayu-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#vayu-bg)" stroke="#27272a" stroke-width="1.5" />

  <!-- Inner Subtle Atmosphere Ring -->
  <circle cx="24" cy="24" r="16.5" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Atmospheric Flow Stream 1: Upper Swirl (Wind / Vayu) -->
  <path
    d="M13 21.5C13 16.25 17.25 12 22.5 12C27.75 12 32 16.25 32 21.5C32 23.5 30.5 25 28.5 25C26.5 25 25 23.5 25 21.5C25 20.1 23.9 19 22.5 19C21.1 19 20 20.1 20 21.5C20 22.9 21.1 24 22.5 24H29.5"
    stroke="url(#vayu-cyan)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Atmospheric Flow Stream 2: Lower Protective Eye (Vision / Drishti) -->
  <path
    d="M35 26.5C35 31.75 30.75 36 25.5 36C20.25 36 16 31.75 16 26.5C16 24.5 17.5 23 19.5 23C21.5 23 23 24.5 23 26.5C23 27.9 24.1 29 25.5 29C26.9 29 28 27.9 28 26.5C28 25.1 26.9 24 25.5 24H18.5"
    stroke="url(#vayu-emerald)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Central Drishti Pupil (Precision Core Telemetry) -->
  <circle cx="24" cy="24" r="3.2" fill="#34d399" filter="url(#vayu-glow)" />
  <circle cx="24" cy="24" r="1.5" fill="#ffffff" />
</svg>
